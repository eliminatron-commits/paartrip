name: Deploy

# Bei jedem Push auf main: Typecheck → Tests → Build → Deploy auf GitHub Pages.
# Schlägt ein Schritt fehl, wird nicht veröffentlicht.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: WebKit für Playwright installieren
        run: npx playwright install --with-deps webkit
      - name: Tests (Playwright, WebKit)
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
