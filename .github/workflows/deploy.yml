name: Deploy

# Bei jedem Push auf main: Typecheck → Tests → Build → Worker (Cloudflare) → App (GitHub Pages).
# Schlägt ein Schritt fehl, wird nichts Weiteres veröffentlicht.
# Der Worker kommt vor der App: Eine neue App soll nie auf einen älteren Worker treffen.
on:
  push:
    branches: [main]

# Grundsatz: nur lesen. Veröffentlichen darf allein der Job, der es tut – der Build führt Paketcode
# und Tests aus und bekommt deshalb keine Deploy-Rechte.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages liest die Pages-Einstellungen des Repos.
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: WebKit für Playwright installieren
        run: npx playwright install --with-deps webkit
      - name: Tests (Playwright, WebKit)
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  worker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Repo-Secrets; der Token darf nur Workers und D1 dieses Kontos bearbeiten.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inhalte für den Worker bündeln
        run: npm run content
      - name: Datenbank-Migrationen anwenden
        run: npx wrangler d1 migrations apply paartrip --remote --config worker/wrangler.jsonc
      - name: Worker veröffentlichen
        run: npx wrangler deploy --config worker/wrangler.jsonc

  deploy:
    needs: [build, worker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
