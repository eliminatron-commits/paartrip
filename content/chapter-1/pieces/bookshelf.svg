<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bookshelf-shadow">
      <stop offset="0" stop-color="#2A160E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A160E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bookshelf-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B98258"/>
      <stop offset="0.5" stop-color="#A06C42"/>
      <stop offset="1" stop-color="#6E4226"/>
    </linearGradient>
    <linearGradient id="bookshelf-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2A18"/>
      <stop offset="1" stop-color="#6B4028"/>
    </linearGradient>
    <linearGradient id="bookshelf-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A160E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A160E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bookshelf-weave" width="6" height="5" patternUnits="userSpaceOnUse">
      <rect width="6" height="5" fill="#B07A45"/>
      <rect x="0.300" y="0.300" width="2.700" height="2" rx="0.700" fill="#D9A76C"/>
      <rect x="3.300" y="2.800" width="2.700" height="2" rx="0.700" fill="#D9A76C"/>
    </pattern>
  </defs>
  <ellipse cx="50" cy="96.500" rx="42" ry="3.600" fill="url(#bookshelf-shadow)"/>
  <!-- Korpus mit vier Fächern -->
  <rect x="16" y="93" width="6" height="5" fill="#4A2A18"/>
  <rect x="78" y="93" width="6" height="5" fill="#4A2A18"/>
  <rect x="13" y="5" width="74" height="89" rx="2.500" fill="url(#bookshelf-wood)"/>
  <rect x="17" y="9" width="66" height="81" fill="url(#bookshelf-back)"/>
  <g fill="url(#bookshelf-dark)">
    <rect x="17" y="9" width="66" height="7"/>
    <rect x="17" y="31.500" width="66" height="7"/>
    <rect x="17" y="53" width="66" height="7"/>
    <rect x="17" y="74" width="66" height="7"/>
  </g>
  <!-- Oben: Bücher und eine Pflanze, die herunterhängt -->
  <rect x="20" y="13" width="5" height="16" fill="#C96A45"/>
  <rect x="25.500" y="11" width="6" height="18" fill="#2C6370"/>
  <rect x="32" y="14" width="4.500" height="15" fill="#DFA544"/>
  <rect x="37" y="12" width="5.500" height="17" fill="#F1E2C2"/>
  <rect x="43" y="15" width="4.500" height="14" fill="#7F9682"/>
  <rect x="50.500" y="13" width="5" height="16" fill="#8E4A46" transform="rotate(14 53 29)"/>
  <g fill="#FBF1DE" opacity="0.7">
    <rect x="26.800" y="14" width="3.400" height="1.200"/>
    <rect x="38" y="15" width="3.500" height="1"/>
    <rect x="21" y="16" width="3" height="1"/>
  </g>
  <path d="M65 29h13l-1.500-8.500h-10z" fill="#E39468"/>
  <rect x="64.500" y="19" width="14" height="2.600" rx="1" fill="#F6B48E"/>
  <g fill="#4F8250">
    <ellipse cx="68" cy="16" rx="4" ry="2.600" transform="rotate(-30 68 16)"/>
    <ellipse cx="75" cy="15" rx="4" ry="2.600" transform="rotate(24 75 15)"/>
    <ellipse cx="71.500" cy="12" rx="3.400" ry="2.400"/>
  </g>
  <path d="M77 19c5 4 4 10 2 14c-1 3 1 5 2 7" fill="none" stroke="#5E9159" stroke-width="1" stroke-linecap="round"/>
  <g fill="#79AB6B">
    <ellipse cx="81.500" cy="24" rx="2.600" ry="1.700" transform="rotate(50 81.500 24)"/>
    <ellipse cx="78.500" cy="30" rx="2.600" ry="1.700" transform="rotate(-40 78.500 30)"/>
    <ellipse cx="82" cy="36.500" rx="2.400" ry="1.600" transform="rotate(50 82 36.500)"/>
    <ellipse cx="79.500" cy="42" rx="2.200" ry="1.500" transform="rotate(-30 79.500 42)"/>
  </g>
  <!-- Zweites Fach: zwei Keramikvögel, ein großer und ein kleiner, und Bücher -->
  <path d="M23 51c-3-5-1-11 4-12c3-.500 5 1.500 5.500 4l3.500-1l-3 3.500c.500 2.500-.500 5-2.500 5.500z" fill="#2C6370"/>
  <circle cx="29" cy="42.300" r="0.700" fill="#FBF1DE"/>
  <path d="M38 51c-2-3.500-.700-7.600 2.800-8.300c2.100-.400 3.500 1 3.900 2.800l2.500-.700l-2.200 2.500c.400 1.700-.300 3.300-1.700 3.700z" fill="#DE9A92"/>
  <circle cx="42.200" cy="45" r="0.500" fill="#8E4A46"/>
  <rect x="52" y="36" width="5" height="15" fill="#F1E2C2"/>
  <rect x="57.500" y="34" width="6" height="17" fill="#C96A45"/>
  <rect x="64" y="37" width="4.500" height="14" fill="#2C6370"/>
  <rect x="69" y="35" width="5" height="16" fill="#DFA544"/>
  <rect x="74.500" y="38" width="5" height="13" fill="#7F9682"/>
  <rect x="58.800" y="37" width="3.400" height="1.200" fill="#FBF1DE" opacity="0.7"/>
  <!-- Drittes Fach: Bücher, liegend und stehend, und eine kleine Uhr -->
  <rect x="20" y="57" width="5.500" height="16" fill="#8E4A46"/>
  <rect x="26" y="59" width="4.500" height="14" fill="#F1E2C2"/>
  <rect x="31" y="56" width="6" height="17" fill="#2C6370"/>
  <rect x="37.500" y="60" width="4.500" height="13" fill="#DFA544"/>
  <rect x="46" y="68" width="22" height="5" rx="0.800" fill="#C96A45"/>
  <rect x="48" y="63.500" width="19" height="4.500" rx="0.800" fill="#7F9682"/>
  <rect x="47" y="59.500" width="17" height="4" rx="0.800" fill="#F1E2C2"/>
  <circle cx="75" cy="67" r="6" fill="#DFA544"/>
  <circle cx="75" cy="67" r="4.600" fill="#FFFAEE"/>
  <path d="M75 67v-3M75 67l2.200 1.300" stroke="#3A2216" stroke-width="0.800" stroke-linecap="round"/>
  <!-- Unten: zwei Körbe -->
  <rect x="20" y="79" width="28" height="11" rx="1.500" fill="url(#bookshelf-weave)"/>
  <rect x="52" y="79" width="28" height="11" rx="1.500" fill="url(#bookshelf-weave)"/>
  <rect x="29" y="82" width="10" height="3" rx="1.500" fill="#4A2A18" opacity="0.6"/>
  <rect x="61" y="82" width="10" height="3" rx="1.500" fill="#4A2A18" opacity="0.6"/>
  <!-- Böden und Kante -->
  <g fill="#C6905F">
    <rect x="17" y="29" width="66" height="2.600"/>
    <rect x="17" y="51" width="66" height="2.600"/>
    <rect x="17" y="73" width="66" height="2.600"/>
  </g>
  <g fill="#F2CFA2" opacity="0.6">
    <rect x="17" y="29" width="66" height="0.700"/>
    <rect x="17" y="51" width="66" height="0.700"/>
    <rect x="17" y="73" width="66" height="0.700"/>
    <rect x="14.500" y="6" width="71" height="0.900"/>
  </g>
</svg>
