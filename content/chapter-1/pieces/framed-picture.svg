<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="framed-picture-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9825A"/>
      <stop offset="1" stop-color="#6E4226"/>
    </linearGradient>
    <linearGradient id="framed-picture-sky" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="62">
      <stop offset="0" stop-color="#4D4F86"/>
      <stop offset="0.55" stop-color="#D97F74"/>
      <stop offset="1" stop-color="#FBCB80"/>
