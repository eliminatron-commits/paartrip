    <linearGradient id="framed-picture-sea" gradientUnits="userSpaceOnUse" x1="0" y1="62" x2="0" y2="85">
      <stop offset="0" stop-color="#3C7A87"/>
      <stop offset="1" stop-color="#173F49"/>
    </linearGradient>
    <radialGradient id="framed-picture-sun" gradientUnits="userSpaceOnUse" cx="50" cy="62" r="20">
      <stop offset="0" stop-color="#FFF3C8" stop-opacity="0.9"/>
