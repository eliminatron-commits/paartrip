  <ellipse cx="45" cy="41" rx="9" ry="2.400" fill="#FFF3D8" opacity="0.5"/>
  <ellipse cx="78" cy="54" rx="12.500" ry="10" fill="url(#bread-basket-roll)"/>
  <path d="M70.500 50q7.500-5 15 0" fill="none" stroke="#FBE3B8" stroke-width="1.700" stroke-linecap="round"/>
  <g fill="#FFF6E0">
    <circle cx="74" cy="48.500" r="0.800"/>
    <circle cx="80" cy="47.600" r="0.800"/>
    <circle cx="84.500" cy="50.500" r="0.800"/>
    <circle cx="20" cy="49.500" r="0.800"/>
    <circle cx="26" cy="49" r="0.800"/>
  </g>
  <!-- Geflochtener Korb mit Tuch -->
  <path d="M11 61h78l-7.500 29.500c-.800 3-3 4.500-6 4.500h-51c-3 0-5.200-1.500-6-4.500z" fill="url(#bread-basket-weave)"/>
  <path d="M11 61h78l-7.500 29.500c-.800 3-3 4.500-6 4.500h-51c-3 0-5.200-1.500-6-4.500z" fill="url(#bread-basket-round)"/>
  <path d="M34 60l12 21c1.600 2.400 4 2.400 5.400 0L64 60z" fill="#FBF1DE"/>
  <path d="M40.500 60l8.200 15M57.500 60l-8.200 15" stroke="#C96A45" stroke-width="1.500" fill="none"/>
  <path d="M34 60l12 21c1.600 2.400 4 2.400 5.400 0L64 60z" fill="url(#bread-basket-round)" opacity="0.5"/>
  <rect x="8" y="56.500" width="84" height="7.500" rx="3.700" fill="#C9955C"/>
  <g stroke="#8A5A30" stroke-width="1.100" stroke-linecap="round" opacity="0.7">
    <path d="M14 57.500l3 5.500M22 57.500l3 5.500M30 57.500l3 5.500M38 57.500l3 5.500M46 57.500l3 5.500M54 57.500l3 5.500M62 57.500l3 5.500M70 57.500l3 5.500M78 57.500l3 5.500M86 57.500l2.500 5"/>
