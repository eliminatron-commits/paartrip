<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bread-basket-shadow">
      <stop offset="0" stop-color="#2A160E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2A160E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bread-basket-crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B068"/>
      <stop offset="1" stop-color="#A5622A"/>
    </linearGradient>
    <linearGradient id="bread-basket-roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C484"/>
      <stop offset="1" stop-color="#BF7D3C"/>
    </linearGradient>
    <pattern id="bread-basket-weave" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#9C6A3A"/>
      <rect x="0.400" y="0.400" width="4.600" height="3.400" rx="1.200" fill="#D9A76C"/>
      <rect x="5.400" y="4.400" width="4.600" height="3.400" rx="1.200" fill="#D9A76C"/>
      <rect x="5.400" y="0.400" width="4.600" height="3.400" rx="1.200" fill="#C08B52"/>
      <rect x="0.400" y="4.400" width="4.600" height="3.400" rx="1.200" fill="#C08B52"/>
    </pattern>
    <linearGradient id="bread-basket-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE2B4" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#FFE2B4" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A1C10" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="95.500" rx="42" ry="3.800" fill="url(#bread-basket-shadow)"/>
  <!-- Baguette, Laib und zwei Brötchen -->
  <rect x="20" y="22" width="60" height="14" rx="7" transform="rotate(-34 50 29)" fill="url(#bread-basket-crust)"/>
  <g stroke="#FBE3B8" stroke-width="1.600" stroke-linecap="round" transform="rotate(-34 50 29)">
    <path d="M32 25.500l5 7M44 25.500l5 7M56 25.500l5 7M68 25.500l5 7"/>
  </g>
  <ellipse cx="23" cy="55" rx="12" ry="10" fill="url(#bread-basket-roll)"/>
  <path d="M15.500 51.500q7.500-5 15 0" fill="none" stroke="#FBE3B8" stroke-width="1.700" stroke-linecap="round"/>
  <path d="M30 62c-3.500-15 6-26 21-26s24.500 11 21 26z" fill="url(#bread-basket-crust)"/>
  <g fill="none" stroke="#FBE8C6" stroke-width="2" stroke-linecap="round">
