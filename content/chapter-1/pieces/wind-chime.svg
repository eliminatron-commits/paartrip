<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wind-chime-bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8944C"/>
      <stop offset="0.35" stop-color="#F3DFA6"/>
      <stop offset="1" stop-color="#A27E3A"/>
    </linearGradient>
    <linearGradient id="wind-chime-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6905F"/>
      <stop offset="1" stop-color="#7A4A2E"/>
    </linearGradient>
    <!-- Ein Bambusrohr von 10 Einheiten Länge; die Röhren sind dasselbe, gestreckt -->
    <g id="wind-chime-tube">
      <rect x="-3.200" width="6.400" height="10" rx="1.400" fill="url(#wind-chime-bamboo)"/>
    </g>
  </defs>
  <!-- Schatten an der Wand -->
  <g fill="#3A2216" opacity="0.18" transform="translate(3.500 3)">
    <rect x="24.800" y="30" width="6.400" height="34" rx="1.400"/>
    <rect x="36.800" y="30" width="6.400" height="46" rx="1.400"/>
    <rect x="56.800" y="30" width="6.400" height="52" rx="1.400"/>
    <rect x="68.800" y="30" width="6.400" height="40" rx="1.400"/>
  </g>
  <!-- Wandarm und Aufhängung -->
  <rect x="6" y="4" width="5" height="16" rx="1.600" fill="url(#wind-chime-wood)"/>
  <path d="M9 8h38c3 0 4.500 1.500 4.500 4" fill="none" stroke="#7A4A2E" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 7.200h36" stroke="#E0B58C" stroke-width="0.800" opacity="0.7"/>
  <path d="M50 12v6" stroke="#3A2216" stroke-width="1"/>
  <g class="fx-sway">
    <!-- Holzscheibe -->
    <ellipse cx="50" cy="21.500" rx="28" ry="4.600" fill="#7A4A2E"/>
    <ellipse cx="50" cy="20" rx="28" ry="4.400" fill="#C6905F"/>
    <ellipse cx="50" cy="20" rx="22" ry="3" fill="#D9A777" opacity="0.7"/>
    <!-- Schnüre und Röhren, jede anders lang -->
    <g stroke="#6B4630" stroke-width="0.700">
      <path d="M28 23v7M40 24v6M60 24v6M72 23v7M50 24v38"/>
    </g>
    <use href="#wind-chime-tube" transform="translate(28 30) scale(1 3.400)"/>
    <use href="#wind-chime-tube" transform="translate(40 30) scale(1 4.600)"/>
    <use href="#wind-chime-tube" transform="translate(60 30) scale(1 5.200)"/>
    <use href="#wind-chime-tube" transform="translate(72 30) scale(1 4)"/>
    <g fill="#8A6A2E" opacity="0.6">
      <rect x="24.800" y="42" width="6.400" height="1"/>
      <rect x="36.800" y="46" width="6.400" height="1"/>
      <rect x="36.800" y="62" width="6.400" height="1"/>
      <rect x="56.800" y="48" width="6.400" height="1"/>
      <rect x="56.800" y="66" width="6.400" height="1"/>
      <rect x="68.800" y="44" width="6.400" height="1"/>
      <rect x="68.800" y="58" width="6.400" height="1"/>
    </g>
    <!-- Klöppel und Windfang -->
    <ellipse cx="50" cy="56" rx="5.500" ry="2.400" fill="#8C5A3C"/>
    <ellipse cx="50" cy="55.200" rx="5.500" ry="2.200" fill="#C6905F"/>
    <path d="M50 62v10" stroke="#6B4630" stroke-width="0.700"/>
    <path d="M50 72l7 9l-7 15l-7-15z" fill="#E7A9A0"/>
    <path d="M50 72l7 9l-7 15z" fill="#C0736C"/>
    <path d="M47 82h6M48 86h4" stroke="#8E4A46" stroke-width="0.700" stroke-linecap="round"/>
  </g>
</svg>
