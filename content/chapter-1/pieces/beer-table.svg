<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="beer-table-shadow">
      <stop offset="0" stop-color="#14261C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#14261C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beer-table-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0AE5A"/>
      <stop offset="1" stop-color="#B8742E"/>
    </linearGradient>
    <linearGradient id="beer-table-beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CF8520"/>
      <stop offset="0.35" stop-color="#FCCF5E"/>
      <stop offset="1" stop-color="#C0761A"/>
    </linearGradient>
    <!-- Ein Krug; der kleine ist derselbe, verkleinert -->
    <g id="beer-table-mug">
      <path d="M13 6h3.500c3.500 0 5.500 2 5.500 5.500v3c0 3.500-2 5.500-5.500 5.500H13v-3h3c1.600 0 2.500-.900 2.500-2.500v-3c0-1.600-.900-2.500-2.500-2.500h-3z" fill="#E9E3D2"/>
      <rect y="1" width="14" height="23" rx="2" fill="#EDE6D3"/>
      <rect x="1.200" y="4" width="11.600" height="18.800" rx="1.300" fill="url(#beer-table-beer)"/>
      <path d="M-1 3.500c-1.500-3 1-5.500 3.500-4.500c1.500-3 6-3 7.500-.500c2.500-1.500 6 0 5.500 3.500c1 .500 1 2-.200 2.500H0c-.800-.200-1.200-.600-1-1z" fill="#FFF9EA"/>
      <rect x="3" y="6" width="1.600" height="14" rx="0.800" fill="#FFF3C4" opacity="0.6"/>
    </g>
  </defs>
  <ellipse cx="50" cy="96.500" rx="46" ry="3.800" fill="url(#beer-table-shadow)"/>
  <!-- Hintere Bank -->
  <rect x="13" y="63" width="74" height="4.500" rx="1.800" fill="#A9682A"/>
  <g stroke="#2F5238" stroke-width="2.400" stroke-linecap="round">
    <path d="M24 68l-3 26M76 68l3 26"/>
  </g>
  <!-- Tisch mit grünem Klappgestell -->
  <g fill="none" stroke="#3F6A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 52l-7 43M34 52l7 43M17.500 80h21"/>
    <path d="M78 52l7 43M66 52l-7 43M82.500 80h-21"/>
  </g>
  <g fill="none" stroke="#7FAE8E" stroke-width="0.800" stroke-linecap="round" opacity="0.7">
    <path d="M21 53l-6.600 41M77 53l6.600 41"/>
  </g>
  <rect x="5" y="45" width="90" height="7" rx="2.400" fill="url(#beer-table-wood)"/>
  <rect x="7" y="45.600" width="86" height="1.100" rx="0.500" fill="#FFE2B4" opacity="0.8"/>
  <rect x="5" y="50" width="90" height="2" rx="1" fill="#7A4A1A" opacity="0.4"/>
  <!-- Zwei Krüge, ein großer und ein kleiner, und eine Breze auf dem Brett -->
  <use href="#beer-table-mug" transform="translate(22 21)"/>
  <use href="#beer-table-mug" transform="translate(48 28.200) scale(0.700)"/>
  <ellipse cx="78" cy="44" rx="13" ry="2.400" fill="#8C5A3C"/>
  <ellipse cx="78" cy="43.300" rx="13" ry="2.200" fill="#C6905F"/>
  <g fill="none" stroke="#9A5222" stroke-width="3" stroke-linecap="round">
    <path d="M70.500 41.500c0-6 5-9.500 7.500-5.500c2.500-4 7.500-.500 7.500 5.500"/>
    <path d="M73 36.500c3 1 6 3.500 10 6.500M83 36.500c-3 1-6 3.500-10 6.500"/>
  </g>
  <g fill="#FFF9EA">
    <circle cx="72" cy="38.500" r="0.600"/>
    <circle cx="78" cy="35.600" r="0.600"/>
    <circle cx="84" cy="38.500" r="0.600"/>
    <circle cx="78" cy="40" r="0.600"/>
  </g>
  <!-- Vordere Bank -->
  <g fill="none" stroke="#3F6A4A" stroke-width="2.800" stroke-linecap="round">
    <path d="M20 78l-4 18M30 78l4 18M80 78l4 18M70 78l-4 18"/>
  </g>
  <rect x="9" y="72" width="82" height="6" rx="2.200" fill="url(#beer-table-wood)"/>
  <rect x="11" y="72.600" width="78" height="1" rx="0.500" fill="#FFE2B4" opacity="0.8"/>
</svg>
