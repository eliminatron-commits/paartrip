<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pinboard-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6905F"/>
      <stop offset="1" stop-color="#7A4A2E"/>
    </linearGradient>
    <radialGradient id="pinboard-cork" gradientUnits="userSpaceOnUse" cx="44" cy="44" r="62">
      <stop offset="0" stop-color="#E3B987"/>
      <stop offset="1" stop-color="#B5854F"/>
    </radialGradient>
    <pattern id="pinboard-grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2.500" r="0.700" fill="#8A5A30" opacity="0.35"/>
      <circle cx="6.500" cy="6" r="0.600" fill="#8A5A30" opacity="0.3"/>
      <circle cx="5" cy="1.500" r="0.500" fill="#F6DDB4" opacity="0.5"/>
      <circle cx="1.500" cy="7" r="0.500" fill="#F6DDB4" opacity="0.45"/>
    </pattern>
    <linearGradient id="pinboard-sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D4F86"/>
      <stop offset="0.6" stop-color="#E08A72"/>
      <stop offset="1" stop-color="#FBCB80"/>
    </linearGradient>
  </defs>
  <!-- Schatten an der Wand, Rahmen und Kork -->
  <rect x="9.500" y="15" width="86" height="80" rx="3" fill="#3A2216" opacity="0.22"/>
