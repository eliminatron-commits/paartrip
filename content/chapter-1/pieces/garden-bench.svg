<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="garden-bench-shadow">
      <stop offset="0" stop-color="#14261C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#14261C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="garden-bench-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9AE80"/>
      <stop offset="1" stop-color="#96673F"/>
    </linearGradient>
    <linearGradient id="garden-bench-post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6905F"/>
      <stop offset="1" stop-color="#6E4226"/>
    </linearGradient>
    <linearGradient id="garden-bench-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8B99"/>
      <stop offset="1" stop-color="#1F4E5A"/>
    </linearGradient>
    <linearGradient id="garden-bench-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0B4AA"/>
      <stop offset="1" stop-color="#C0736C"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="96.500" rx="46" ry="3.800" fill="url(#garden-bench-shadow)"/>
  <!-- Hintere Beine, Lehne mit drei Latten -->
  <rect x="20" y="68" width="4" height="26" fill="#5E3A22"/>
  <rect x="76" y="68" width="4" height="26" fill="#5E3A22"/>
  <rect x="11" y="28" width="5.500" height="44" rx="2" fill="url(#garden-bench-post)"/>
  <rect x="83.500" y="28" width="5.500" height="44" rx="2" fill="url(#garden-bench-post)"/>
  <rect x="14" y="32" width="72" height="6.500" rx="2" fill="url(#garden-bench-wood)"/>
  <rect x="14" y="41.500" width="72" height="6.500" rx="2" fill="url(#garden-bench-wood)"/>
  <rect x="14" y="51" width="72" height="6.500" rx="2" fill="url(#garden-bench-wood)"/>
  <g fill="#F9DEB8" opacity="0.7">
    <rect x="16" y="32.600" width="68" height="0.900"/>
    <rect x="16" y="42.100" width="68" height="0.900"/>
    <rect x="16" y="51.600" width="68" height="0.900"/>
  </g>
  <!-- Decke über der Lehne -->
  <path d="M60 30h22v27l-2.200 2l-2.200-2l-2.200 2l-2.200-2l-2.200 2l-2.200-2l-2.200 2l-2.200-2l-2.200 2l-2.200-2z" fill="#FBF1DE"/>
  <g fill="#C96A45">
    <rect x="60" y="36" width="22" height="2.600"/>
    <rect x="60" y="48" width="22" height="2.600"/>
  </g>
  <rect x="60" y="42.400" width="22" height="1.300" fill="#DFA544"/>
  <rect x="60" y="30" width="22" height="3" fill="#E6D2AF"/>
  <rect x="78" y="33" width="4" height="24" fill="#B99C72" opacity="0.3"/>
  <!-- Zwei Kissen: ein großes in Petrol, ein kleines in Rosé -->
  <rect x="19" y="43" width="24" height="20" rx="6" transform="rotate(-6 31 53)" fill="url(#garden-bench-teal)"/>
  <path d="M24 49c5-2 10-2 15 0" fill="none" stroke="#9CCBD4" stroke-width="1" stroke-linecap="round" opacity="0.7" transform="rotate(-6 31 53)"/>
  <rect x="42" y="47.500" width="18" height="15.500" rx="5" transform="rotate(7 51 55)" fill="url(#garden-bench-rose)"/>
  <circle cx="51" cy="55" r="1.300" fill="#FBE3DC"/>
  <!-- Sitz, Armlehnen, vordere Beine -->
  <rect x="7" y="62" width="86" height="6.500" rx="2.400" fill="url(#garden-bench-wood)"/>
  <rect x="9" y="62.600" width="82" height="1" rx="0.500" fill="#F9DEB8" opacity="0.8"/>
  <rect x="11" y="68.500" width="78" height="4" fill="#7A4C30"/>
  <rect x="11" y="68.500" width="78" height="1.600" fill="#14261C" opacity="0.3"/>
  <rect x="9" y="64" width="6" height="32" rx="2" fill="url(#garden-bench-post)"/>
  <rect x="85" y="64" width="6" height="32" rx="2" fill="url(#garden-bench-post)"/>
  <rect x="4" y="50" width="16" height="4.500" rx="2.200" fill="url(#garden-bench-wood)"/>
  <rect x="80" y="50" width="16" height="4.500" rx="2.200" fill="url(#garden-bench-wood)"/>
  <rect x="9.500" y="54.500" width="4.500" height="9" fill="#8C5A3C"/>
  <rect x="86" y="54.500" width="4.500" height="9" fill="#8C5A3C"/>
</svg>
