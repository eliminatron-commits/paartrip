    <ellipse cx="54" cy="34" rx="2.200" ry="3.200" transform="rotate(-20 54 34)"/>
    <ellipse cx="20" cy="70" rx="2" ry="3" transform="rotate(-30 20 70)"/>
    <ellipse cx="82" cy="66" rx="2" ry="3" transform="rotate(30 82 66)"/>
