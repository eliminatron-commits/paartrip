    <use href="#climbing-roses-leaf" transform="translate(36 44) rotate(70)"/>
    <use href="#climbing-roses-leaf" transform="translate(70 78) rotate(-60)"/>
    <use href="#climbing-roses-leaf" transform="translate(74 58) rotate(70)"/>
    <use href="#climbing-roses-leaf" transform="translate(66 40) rotate(-70)"/>
    <use href="#climbing-roses-leaf" transform="translate(44 18) rotate(60)"/>
    <use href="#climbing-roses-leaf" transform="translate(56 54) rotate(-30)"/>
  </g>
  <!-- Rosen in drei Tönen und ein paar Knospen -->
