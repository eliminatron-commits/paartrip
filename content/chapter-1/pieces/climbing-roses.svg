    <path d="M28 100c-6-16 8-22 2-38s10-22 4-36c-2-6 2-12 8-16"/>
    <path d="M72 100c6-14-8-22-2-36s-8-20-2-34c2-5 0-10-4-14"/>
    <path d="M30 62c10-4 20 0 28-8M70 64c-8-6-18-2-24-10M34 26c8 2 16-2 22-8"/>
  </g>
  <g fill="#4F8250">
