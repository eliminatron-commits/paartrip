    <use href="#climbing-roses-leaf" transform="translate(33 72) rotate(50) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(28 50) rotate(-50) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(38 36) rotate(40) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(76 86) rotate(40) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(66 70) rotate(-50) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(72 48) rotate(50) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(64 30) rotate(-40) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(48 58) rotate(20) scale(1.100)"/>
    <use href="#climbing-roses-leaf" transform="translate(54 22) rotate(-20) scale(1.100)"/>
  </g>
  <g fill="#79AB6B">
