<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="climbing-roses-lath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="1" stop-color="#CDB993"/>
    </linearGradient>
    <clipPath id="climbing-roses-frame">
      <rect x="12" y="6" width="76" height="92"/>
    </clipPath>
    <!-- Eine Rose; die Farbe kommt von außen -->
    <g id="climbing-roses-bloom">
      <circle r="6.500"/>
      <circle r="6.500" fill="#FFFFFF" opacity="0.14"/>
      <path d="M-3.500 1.500a3.600 3.600 0 1 1 5 3M-5 -1a5.200 5.200 0 0 1 9-2.500M3.500 4.500a5.600 5.600 0 0 1-8 0" fill="none" stroke="#7A1A30" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
      <circle cx="-.500" cy="0" r="1.300" fill="#7A1A30" opacity="0.45"/>
    </g>
    <g id="climbing-roses-leaf">
      <path d="M0 0c-3.500-2-4.500-6-2.500-10c3.500 2 4.500 6 2.500 10z"/>
    </g>
  </defs>
  <!-- Schatten am Zaun und Rankgitter -->
  <rect x="13.500" y="8" width="76" height="92" rx="2" fill="#2A160E" opacity="0.18"/>
  <g clip-path="url(#climbing-roses-frame)" stroke="url(#climbing-roses-lath)" stroke-width="2.600">
    <path d="M12 30L36 6M12 54L60 6M12 78L84 6M12 102L88 26M36 102L88 50M60 102L88 74"/>
    <path d="M88 30L64 6M88 54L40 6M88 78L16 6M88 102L12 26M64 102L12 50M40 102L12 74"/>
  </g>
  <rect x="12" y="6" width="76" height="92" rx="2" fill="none" stroke="url(#climbing-roses-lath)" stroke-width="3.400"/>
