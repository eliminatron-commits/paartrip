  <use href="#climbing-roses-bloom" x="72" y="92" fill="#F2A9B8"/>
  <use href="#climbing-roses-bloom" x="36" y="66" fill="#F6D7DC"/>
  <use href="#climbing-roses-bloom" x="64" y="62" fill="#D9486E"/>
  <use href="#climbing-roses-bloom" x="26" y="42" fill="#F2A9B8"/>
  <use href="#climbing-roses-bloom" x="74" y="38" fill="#F6D7DC"/>
  <use href="#climbing-roses-bloom" x="46" y="48" fill="#E0728A"/>
  <use href="#climbing-roses-bloom" x="42" y="20" fill="#D9486E"/>
