<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="kumquat-tree-shadow">
      <stop offset="0" stop-color="#2A160E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A160E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kumquat-tree-pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9CDB2"/>
      <stop offset="0.35" stop-color="#FFFCF2"/>
      <stop offset="1" stop-color="#BFB092"/>
    </linearGradient>
    <radialGradient id="kumquat-tree-fruit" cx="0.350" cy="0.300" r="0.800">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#E8861E"/>
    </radialGradient>
    <g id="kumquat-tree-q">
      <circle r="2.900" fill="url(#kumquat-tree-fruit)"/>
    </g>
    <g id="kumquat-tree-tuft">
      <ellipse cx="-4" cy="0" rx="5" ry="2.400" transform="rotate(-24 -4 0)"/>
      <ellipse cx="4" cy="0" rx="5" ry="2.400" transform="rotate(24 4 0)"/>
      <ellipse cx="0" cy="-3" rx="2.400" ry="5"/>
    </g>
    <!-- Roter Glücksumschlag am Faden -->
    <g id="kumquat-tree-envelope">
      <path d="M0 0v4" stroke="#DFA544" stroke-width="0.600"/>
      <rect x="-2.800" y="4" width="5.600" height="8.400" rx="0.800" fill="#C8402B"/>
      <rect x="-2.800" y="4" width="5.600" height="2.400" rx="0.800" fill="#A52C1E"/>
      <circle cy="8.800" r="1.200" fill="#F2C76B"/>
    </g>
  </defs>
  <ellipse cx="50" cy="96.500" rx="32" ry="3.600" fill="url(#kumquat-tree-shadow)"/>
  <!-- Stamm -->
  <path d="M47 76c1-8-1-14 2-22h3c2 8 1 14 1 22z" fill="#6B4630"/>
  <!-- Krone: unten breit, oben schmal -->
  <path d="M50 4c12 6 16 14 18 22c9 6 14 15 14 24c0 10-9 16-32 16S18 60 18 50c0-9 5-18 14-24c2-8 6-16 18-22z" fill="#2F5A3A"/>
  <g fill="#3F7448">
    <use href="#kumquat-tree-tuft" x="50" y="14"/>
    <use href="#kumquat-tree-tuft" x="40" y="26"/>
    <use href="#kumquat-tree-tuft" x="60" y="27"/>
    <use href="#kumquat-tree-tuft" x="30" y="40"/>
    <use href="#kumquat-tree-tuft" x="50" y="38"/>
    <use href="#kumquat-tree-tuft" x="70" y="42"/>
    <use href="#kumquat-tree-tuft" x="26" y="54"/>
    <use href="#kumquat-tree-tuft" x="42" y="54"/>
    <use href="#kumquat-tree-tuft" x="58" y="56"/>
    <use href="#kumquat-tree-tuft" x="74" y="55"/>
  </g>
  <g fill="#6FA35E">
    <use href="#kumquat-tree-tuft" x="45" y="20" transform="scale(1)"/>
    <use href="#kumquat-tree-tuft" x="34" y="33"/>
    <use href="#kumquat-tree-tuft" x="56" y="32"/>
    <use href="#kumquat-tree-tuft" x="24" y="47"/>
    <use href="#kumquat-tree-tuft" x="44" y="46"/>
    <use href="#kumquat-tree-tuft" x="64" y="48"/>
    <use href="#kumquat-tree-tuft" x="34" y="60"/>
    <use href="#kumquat-tree-tuft" x="52" y="62"/>
    <use href="#kumquat-tree-tuft" x="68" y="61"/>
  </g>
  <!-- Viele Kumquats -->
  <use href="#kumquat-tree-q" x="50" y="22"/>
  <use href="#kumquat-tree-q" x="42" y="31"/>
  <use href="#kumquat-tree-q" x="59" y="34"/>
  <use href="#kumquat-tree-q" x="49" y="42"/>
  <use href="#kumquat-tree-q" x="33" y="44"/>
  <use href="#kumquat-tree-q" x="67" y="46"/>
  <use href="#kumquat-tree-q" x="39" y="52"/>
  <use href="#kumquat-tree-q" x="57" y="52"/>
  <use href="#kumquat-tree-q" x="25" y="57"/>
  <use href="#kumquat-tree-q" x="75" y="58"/>
  <use href="#kumquat-tree-q" x="46" y="60"/>
  <use href="#kumquat-tree-q" x="64" y="60"/>
  <use href="#kumquat-tree-q" x="31" y="62"/>
  <g fill="#FFF3C8" opacity="0.8">
    <circle cx="49" cy="21" r="0.800"/>
    <circle cx="41" cy="30" r="0.800"/>
    <circle cx="58" cy="33" r="0.800"/>
    <circle cx="48" cy="41" r="0.800"/>
    <circle cx="38" cy="51" r="0.800"/>
    <circle cx="56" cy="51" r="0.800"/>
    <circle cx="66" cy="45" r="0.800"/>
    <circle cx="32" cy="43" r="0.800"/>
  </g>
  <!-- Zwei Glücksumschläge -->
  <use href="#kumquat-tree-envelope" class="fx-sway" x="36" y="34"/>
  <use href="#kumquat-tree-envelope" class="fx-sway" style="animation-delay:-2s" x="63" y="50" transform="scale(1)"/>
  <!-- Keramiktopf mit blauem Muster -->
  <path d="M30 74h40l-4 19c-.500 2.200-2.300 3.500-4.600 3.500H38.600c-2.300 0-4.100-1.300-4.600-3.500z" fill="url(#kumquat-tree-pot)"/>
  <path d="M31.500 81h37l-1.300 6h-34.400z" fill="#2C6370"/>
  <path d="M35 84c2.500-2.500 5-2.500 7.500 0s5 2.500 7.500 0s5-2.500 7.500 0s5 2.500 7.500 0" fill="none" stroke="#FBF1DE" stroke-width="1.100" stroke-linecap="round"/>
  <rect x="28" y="71" width="44" height="5" rx="2" fill="#FFFCF2"/>
  <rect x="28" y="74.500" width="44" height="1.500" rx="0.700" fill="#BFB092" opacity="0.7"/>
  <ellipse cx="50" cy="71.500" rx="19" ry="1.800" fill="#4A2C1A"/>
