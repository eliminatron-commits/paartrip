<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cuckoo-clock-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9683C"/>
      <stop offset="1" stop-color="#5E3218"/>
    </linearGradient>
    <linearGradient id="cuckoo-clock-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4424"/>
      <stop offset="1" stop-color="#42200E"/>
    </linearGradient>
    <radialGradient id="cuckoo-clock-face" cx="0.400" cy="0.350" r="0.800">
      <stop offset="0" stop-color="#FFFBEC"/>
      <stop offset="1" stop-color="#E3CFA6"/>
    </radialGradient>
    <linearGradient id="cuckoo-clock-brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98F3C"/>
      <stop offset="0.4" stop-color="#FFE3A0"/>
      <stop offset="1" stop-color="#A9712A"/>
    </linearGradient>
    <g id="cuckoo-clock-cone">
      <path d="M0 0c3.600 0 5 3 5 7.500S3 16 0 16s-5-4-5-8.500S-3.600 0 0 0z" fill="#6B3A1C"/>
      <path d="M-4.200 4.500l4.200 2.600l4.200-2.600M-4.800 8.500l4.800 2.800l4.800-2.800M-3.800 12.400l3.800 2.200l3.800-2.200" fill="none" stroke="#B07A4E" stroke-width="0.900"/>
    </g>
  </defs>
  <!-- Schatten an der Wand -->
  <path d="M53 9l31 21h-6v37H28V30h-6z" fill="#3A2216" opacity="0.2"/>
  <!-- Ketten mit zwei Zapfen, einem großen und einem kleinen; dazwischen das Pendel -->
  <path d="M36 64v14M64 64v8" stroke="#C98F3C" stroke-width="1" stroke-dasharray="1.400 1.200"/>
  <use href="#cuckoo-clock-cone" transform="translate(36 78) scale(1.050)"/>
  <use href="#cuckoo-clock-cone" transform="translate(64 72) scale(0.780)"/>
  <g class="fx-sway">
    <rect x="49.300" y="62" width="1.400" height="22" fill="#8A5A30"/>
    <path d="M50 81c4 2.500 5.500 6.500 0 12c-5.500-5.500-4-9.500 0-12z" fill="url(#cuckoo-clock-brass)"/>
  </g>
  <!-- Häuschen -->
  <rect x="25" y="26" width="50" height="40" rx="2" fill="url(#cuckoo-clock-wood)"/>
  <g fill="#3A1A0C" opacity="0.25">
    <rect x="25" y="36" width="50" height="0.800"/>
    <rect x="25" y="46" width="50" height="0.800"/>
    <rect x="25" y="56" width="50" height="0.800"/>
  </g>
  <!-- Geschnitztes Laub -->
  <g fill="#5F8A54">
    <path d="M23 66c-6-4-8-10-5-17c5 3 7 9 5 17zM26 52c-6-2-9-7-8-13c5 1 8 6 8 13zM77 66c6-4 8-10 5-17c-5 3-7 9-5 17zM74 52c6-2 9-7 8-13c-5 1-8 6-8 13z"/>
  </g>
  <g fill="#3F6A3C">
    <path d="M30 68c-5 1-9-1-12-5c5-2 9 0 12 5zM70 68c5 1 9-1 12-5c-5-2-9 0-12 5z"/>
  </g>
  <!-- Dach -->
  <path d="M50 4L84 28l-4.500 5L50 12.500L20.500 33L16 28z" fill="url(#cuckoo-clock-roof)"/>
  <path d="M50 4L84 28l-1.300 1.500L50 6.500L17.300 29.500L16 28z" fill="#B07A4E" opacity="0.6"/>
  <!-- Türchen mit Kuckuck -->
  <path d="M43.500 28.500v-7c0-4 2.800-6.500 6.500-6.500s6.500 2.500 6.500 6.500v7z" fill="#2A1208"/>
  <path d="M47 27c-1.500-4 .500-7.500 4-7.500c2.600 0 4.400 1.800 4.400 4.200c0 1.600-.800 2.800-2 3.300z" fill="#7FB3BE"/>
  <path d="M55 22.500l3.500 1l-3.300 1.500z" fill="#F2C76B"/>
  <circle cx="52.600" cy="22.400" r="0.800" fill="#12222C"/>
  <!-- Zifferblatt -->
  <circle cx="50" cy="46" r="15.500" fill="#42200E"/>
  <circle cx="50" cy="46" r="13.500" fill="url(#cuckoo-clock-face)"/>
  <g fill="#5E3218">
    <rect x="49.300" y="34" width="1.400" height="3.400"/>
    <rect x="49.300" y="54.600" width="1.400" height="3.400"/>
    <rect x="38" y="45.300" width="3.400" height="1.400"/>
    <rect x="58.600" y="45.300" width="3.400" height="1.400"/>
  </g>
  <g stroke="url(#cuckoo-clock-brass)" stroke-linecap="round">
    <path d="M50 46l-5.500-5.500" stroke-width="2"/>
    <path d="M50 46l7.500-4.500" stroke-width="1.500"/>
  </g>
  <circle cx="50" cy="46" r="1.800" fill="#5E3218"/>
</svg>
