        <path d="M0 0c-5-9-4-20 0-27c4 7 5 18 0 27z"/>
      </g>
      <ellipse cx="0" cy="-4" rx="3" ry="2.200" fill="#F2C76B"/>
    </g>
    <g id="lotus-pond-pad">
      <path d="M0 0L11-1.500A11 4.400 0 1 0 9 3z"/>
    </g>
  </defs>
  <ellipse cx="50" cy="94" rx="48" ry="5" fill="url(#lotus-pond-shadow)"/>
