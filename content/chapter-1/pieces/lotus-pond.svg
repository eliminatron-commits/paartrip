<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="lotus-pond-shadow">
      <stop offset="0" stop-color="#14261C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14261C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lotus-pond-water" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="92">
      <stop offset="0" stop-color="#8C6A8A"/>
      <stop offset="0.35" stop-color="#3C6E7E"/>
      <stop offset="1" stop-color="#17384A"/>
    </linearGradient>
    <linearGradient id="lotus-pond-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C2B2"/>
      <stop offset="1" stop-color="#857E70"/>
    </linearGradient>
    <linearGradient id="lotus-pond-petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FBE3DC"/>
      <stop offset="1" stop-color="#E0728A"/>
    </linearGradient>
    <g id="lotus-pond-bloom">
