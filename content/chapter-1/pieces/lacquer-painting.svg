<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lacquer-painting-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1410"/>
      <stop offset="0.5" stop-color="#1C0C0C"/>
      <stop offset="1" stop-color="#2E0F0C"/>
    </linearGradient>
    <linearGradient id="lacquer-painting-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#C98A2C"/>
    </linearGradient>
    <linearGradient id="lacquer-painting-petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FBE3DC"/>
      <stop offset="1" stop-color="#E0728A"/>
    </linearGradient>
    <clipPath id="lacquer-painting-panel">
      <rect x="20" y="8" width="60" height="88" rx="1.500"/>
    </clipPath>
    <g id="lacquer-painting-koi">
      <path d="M0 0c5-4.500 13-4.500 19-1c3 1.800 5 1 8-2.500c-.500 3.500-.500 6 0 9.500c-3-3.500-5-4.300-8-2.500c-6 3.500-14 3.500-19-1c-1-.800-1-1.700 0-2.500z"/>
      <path d="M8-3.500c2-2.500 5-3 7-1.500zM9 4.500c2 2 4.500 2.300 6.500 1z" opacity="0.8"/>
    </g>
  </defs>
  <!-- Schatten an der Wand -->
  <rect x="22.500" y="11" width="60" height="88" rx="1.500" fill="#3A2216" opacity="0.25"/>
  <!-- Lacktafel mit goldenem Rand -->
  <rect x="20" y="8" width="60" height="88" rx="1.500" fill="url(#lacquer-painting-ground)"/>
  <rect x="23" y="11" width="54" height="82" fill="none" stroke="url(#lacquer-painting-gold)" stroke-width="0.900"/>
  <g clip-path="url(#lacquer-painting-panel)">
    <!-- Lotusblätter und zwei Blüten -->
    <g fill="none" stroke="#7A9A5A" stroke-width="1.300" stroke-linecap="round">
      <path d="M38 78c1-12-1-22 2-34M58 78c-1-16 2-26 4-40M49 78c0-6 1-12-.500-18"/>
    </g>
    <ellipse cx="34" cy="50" rx="12" ry="5" fill="#4E7A4A" transform="rotate(-12 34 50)"/>
    <path d="M23 51.500q11-5 22-2" fill="none" stroke="#A9C98C" stroke-width="0.800" opacity="0.8"/>
    <ellipse cx="66" cy="56" rx="11" ry="4.600" fill="#3F6A3C" transform="rotate(10 66 56)"/>
    <path d="M56 55q10-3 20 1.500" fill="none" stroke="#A9C98C" stroke-width="0.800" opacity="0.8"/>
    <ellipse cx="48" cy="62" rx="8" ry="3.200" fill="#5F8A54"/>
    <g fill="url(#lacquer-painting-petal)">
      <path d="M40 44c-6-5-7-12-3-18c5 4 6 11 3 18zM40 44c-9-1-14-6-14-13c7 1 12 6 14 13zM40 44c9-1 14-6 14-13c-7 1-12 6-14 13zM40 44c-4-7-3-15 0-20c3 5 4 13 0 20z"/>
      <path d="M62 38c-4-4-5-9-2-14c4 3 5 9 2 14zM62 38c-7-1-10-5-10-10c5 .500 9 4.500 10 10zM62 38c7-1 10-5 10-10c-5 .500-9 4.500-10 10z"/>
    </g>
    <circle cx="40" cy="41" r="2" fill="url(#lacquer-painting-gold)"/>
    <circle cx="62" cy="35.500" r="1.500" fill="url(#lacquer-painting-gold)"/>
    <!-- Wasser mit zwei Koi, einem großen und einem kleinen -->
    <g fill="none" stroke="url(#lacquer-painting-gold)" stroke-width="0.700" stroke-linecap="round" opacity="0.7">
      <path d="M26 72q6-2.500 12 0t12 0M52 76q6-2.500 12 0t10 0M28 88q6-2.500 12 0M56 90q6-2.500 12 0"/>
    </g>
    <use href="#lacquer-painting-koi" transform="translate(30 80) rotate(-8) scale(1.050)" fill="#D9512C"/>
    <use href="#lacquer-painting-koi" transform="translate(72 84) rotate(188) scale(0.720)" fill="url(#lacquer-painting-gold)"/>
    <circle cx="33.500" cy="79" r="0.800" fill="#1C0C0C"/>
    <!-- Goldstaub und der Glanz des Lacks -->
    <g fill="#FFE9A8">
      <circle cx="28" cy="18" r="0.700"/>
      <circle cx="70" cy="16" r="0.600"/>
      <circle cx="50" cy="20" r="0.500"/>
      <circle cx="74" cy="46" r="0.600"/>
      <circle cx="27" cy="64" r="0.600"/>
      <circle cx="46" cy="90" r="0.600"/>
    </g>
    <path d="M10 60L48 2h12L22 60zM52 100l34-54h5l-34 54z" fill="#FFFFFF" opacity="0.1"/>
  </g>
</svg>
