<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="radio-shadow">
      <stop offset="0" stop-color="#2A160E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2A160E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="radio-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E08A62"/>
      <stop offset="1" stop-color="#9C4226"/>
    </linearGradient>
    <linearGradient id="radio-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#E3D0AA"/>
    </linearGradient>
    <radialGradient id="radio-dial">
      <stop offset="0" stop-color="#FFFBE0"/>
      <stop offset="0.7" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#E9A84A"/>
    </radialGradient>
    <radialGradient id="radio-glow">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radio-knob" cx="0.350" cy="0.300" r="0.800">
      <stop offset="0" stop-color="#4C8B99"/>
      <stop offset="1" stop-color="#173F49"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="95.500" rx="44" ry="3.800" fill="url(#radio-shadow)"/>
  <!-- Zwei Noten steigen auf -->
  <g class="fx-steam" fill="#2C6370">
    <ellipse cx="17" cy="23" rx="3" ry="2.300" transform="rotate(-20 17 23)"/>
    <rect x="19" y="9" width="1.400" height="14"/>
    <path d="M19 9c3.600.600 6 2.400 6.600 6c-1.800-1.800-4-2.400-6.600-2.400z"/>
  </g>
  <g class="fx-steam" style="animation-delay:-2s" fill="#B8523A">
    <ellipse cx="33" cy="15" rx="2.300" ry="1.800" transform="rotate(-20 33 15)"/>
    <rect x="34.500" y="4.500" width="1.100" height="10.500"/>
    <path d="M34.500 4.500c2.800.500 4.600 1.900 5 4.600c-1.400-1.400-3-1.800-5-1.800z"/>
  </g>
  <!-- Antenne und Tragegriff -->
  <path d="M74 36L90 9" stroke="#9AA1A4" stroke-width="1.600" stroke-linecap="round"/>
  <circle cx="90.300" cy="8.500" r="2.200" fill="#C5CACB"/>
  <path d="M30 37c0-12 6-17 20-17s20 5 20 17" fill="none" stroke="#6B3A22" stroke-width="3.400" stroke-linecap="round"/>
  <path d="M31 35c.400-10 6-13.600 19-13.600" fill="none" stroke="#C6905F" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Gehäuse -->
  <rect x="14" y="90" width="9" height="5" rx="1.600" fill="#4E2814"/>
  <rect x="77" y="90" width="9" height="5" rx="1.600" fill="#4E2814"/>
  <rect x="8" y="35" width="84" height="57" rx="11" fill="url(#radio-body)"/>
  <rect x="12" y="37" width="76" height="2" rx="1" fill="#FFD2B6" opacity="0.5"/>
  <rect x="14" y="41" width="72" height="45" rx="7" fill="url(#radio-face)"/>
  <!-- Lautsprecher -->
  <rect x="19" y="46" width="32" height="35" rx="5" fill="#B8623E"/>
  <g fill="#FBF1DE" opacity="0.85">
    <rect x="22.500" y="50.500" width="25" height="2" rx="1"/>
    <rect x="22.500" y="55" width="25" height="2" rx="1"/>
    <rect x="22.500" y="59.500" width="25" height="2" rx="1"/>
    <rect x="22.500" y="64" width="25" height="2" rx="1"/>
    <rect x="22.500" y="68.500" width="25" height="2" rx="1"/>
    <rect x="22.500" y="73" width="25" height="2" rx="1"/>
  </g>
  <!-- Beleuchtete Skala und zwei Knöpfe -->
  <circle cx="68" cy="57" r="17" fill="url(#radio-glow)"/>
  <circle cx="68" cy="57" r="11.500" fill="#6B3A22"/>
  <circle cx="68" cy="57" r="10" fill="url(#radio-dial)"/>
  <g stroke="#8A5212" stroke-width="0.900" stroke-linecap="round">
    <path d="M68 48.500v2.200M74 51l-1.500 1.500M76.500 57h-2.200M62 51l1.500 1.500M59.500 57h2.200"/>
  </g>
  <path d="M68 57l5.500-5.500" stroke="#B8402B" stroke-width="1.500" stroke-linecap="round"/>
  <circle cx="68" cy="57" r="1.800" fill="#4E2814"/>
  <circle cx="60.500" cy="77" r="4.600" fill="url(#radio-knob)"/>
  <circle cx="75.500" cy="77" r="4.600" fill="url(#radio-knob)"/>
  <rect x="60" y="73.200" width="1" height="3.200" rx="0.500" fill="#FBF1DE"/>
  <rect x="77" y="74" width="1" height="3.200" rx="0.500" fill="#FBF1DE" transform="rotate(40 75.500 77)"/>
</svg>
