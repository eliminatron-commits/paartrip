  <rect x="2" y="50" width="19" height="41" rx="9.500" fill="url(#sofa-arm)"/>
  <rect x="79" y="50" width="19" height="41" rx="9.500" fill="url(#sofa-arm)"/>
  <ellipse cx="88.500" cy="54.500" rx="6" ry="2.300" fill="#A9D5DD" opacity="0.4"/>
  <ellipse cx="11.500" cy="54.500" rx="6" ry="2.300" fill="#A9D5DD" opacity="0.4"/>
</svg>
