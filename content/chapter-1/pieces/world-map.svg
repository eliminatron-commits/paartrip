<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="world-map-sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFD9D6"/>
      <stop offset="1" stop-color="#86B0B4"/>
    </linearGradient>
    <linearGradient id="world-map-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6905F"/>
      <stop offset="1" stop-color="#7A4A2E"/>
    </linearGradient>
    <linearGradient id="world-map-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A2216" stop-opacity="0.18"/>
      <stop offset="0.12" stop-color="#3A2216" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.88" stop-color="#3A2216" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2216" stop-opacity="0.2"/>
    </linearGradient>
    <g id="world-map-pin">
      <ellipse cx="1.500" cy="1" rx="2.600" ry="1" fill="#12222C" opacity="0.3"/>
      <path d="M0 0v-5" stroke="#5E3218" stroke-width="0.900" stroke-linecap="round"/>
      <circle cx="0" cy="-7" r="3" fill="#C8402B"/>
      <circle cx="-.900" cy="-7.900" r="1" fill="#FFB8A8"/>
    </g>
  </defs>
  <!-- Schatten an der Wand, Schnur und Nagel -->
  <rect x="9" y="20" width="88" height="72" rx="2" fill="#3A2216" opacity="0.2"/>
  <path d="M12 18L50 6l38 12" fill="none" stroke="#6B4630" stroke-width="0.900"/>
  <circle cx="50" cy="6" r="1.600" fill="#4A2C1A"/>
  <!-- Karte zwischen zwei Holzleisten -->
  <rect x="8" y="20" width="84" height="66" fill="url(#world-map-sea)"/>
  <g fill="none" stroke="#FBF7EA" stroke-width="0.500" opacity="0.5">
    <path d="M8 36h84M8 53h84M8 70h84M29 20v66M50 20v66M71 20v66"/>
  </g>
  <g fill="#F1E2C2">
    <!-- Amerika -->
    <path d="M11 30c4-3 9-3 13-1c1 3-1 5-3 7c-1 3-3 4-5 4c-1 2 1 4 3 5c2 3 4 7 3 12c-1 4-2 8-4 11c-2-3-2-7-2-11c-2-3-3-6-3-9c-2-3-4-6-4-10c0-3 .800-6 2-8z"/>
    <!-- Europa und Afrika -->
    <path d="M42 30c2-2 5-3 8-2c1 2 0 4-2 5c2 1 4 1 5 3c-2 2-5 2-7 1c-2 1-4 0-5-2c-1-2 0-4 1-5z"/>
    <path d="M42 42c3-2 8-2 11 0c2 3 2 7 1 10c-1 4-2 9-5 13c-3-3-4-8-4-12c-2-3-4-7-3-11z"/>
    <!-- Asien -->
    <path d="M55 28c6-3 14-4 22-2c4 1 8 3 10 6c-2 2-5 2-7 4c0 3-2 5-4 6c-1 3-2 6-4 7c-2-2-2-5-3-7c-3 1-5 4-7 3c-2-2-1-5-3-7c-2-1-4-3-4-5c0-2 2-4 4-5z"/>
    <!-- Australien -->
    <path d="M74 64c3-2 8-2 11 0c1 3 0 6-3 7c-3 1-7 0-9-2c-1-2 0-4 1-5z"/>
  </g>
  <g fill="#B8CFA4" opacity="0.7">
    <path d="M14 33c3-2 6-2 8 0c-1 2-3 3-5 3c-1 0-2-1-3-3zM60 31c5-2 11-2 16 0c-3 2-6 2-9 4c-3 0-5-2-7-4zM44 45c2-1 5-1 7 0c0 3-1 6-3 8c-2-2-4-5-4-8z"/>
  </g>
  <!-- Zwei Stecknadeln, verbunden mit einem Faden -->
  <path d="M48.500 32.500c8-9 19-7 23.500 9" fill="none" stroke="#B8402B" stroke-width="1" stroke-dasharray="2.200 1.800" stroke-linecap="round"/>
  <use href="#world-map-pin" x="48.500" y="33.500"/>
  <use href="#world-map-pin" x="72" y="42.500"/>
  <rect x="8" y="20" width="84" height="66" fill="url(#world-map-fold)"/>
  <rect x="5" y="15" width="90" height="6" rx="2" fill="url(#world-map-rail)"/>
  <rect x="5" y="85" width="90" height="6" rx="2" fill="url(#world-map-rail)"/>
  <rect x="7" y="15.600" width="86" height="1" fill="#F2CFA2" opacity="0.7"/>
  <rect x="8" y="21" width="84" height="2" fill="#3A2216" opacity="0.2"/>
</svg>
