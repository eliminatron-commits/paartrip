<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="garden-front-dim" gradientUnits="userSpaceOnUse" cx="210" cy="150" r="290">
      <stop offset="0.5" stop-color="#101C2A" stop-opacity="0"/>
      <stop offset="1" stop-color="#101C2A" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="garden-front-firefly">
      <stop offset="0" stop-color="#FFF7B0" stop-opacity="0.95"/>
