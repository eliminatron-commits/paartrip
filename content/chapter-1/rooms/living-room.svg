      <circle cx="26" cy="0" r="0.900" fill="#B67F58" opacity="0.22"/>
      <circle cx="0" cy="30" r="0.900" fill="#B67F58" opacity="0.22"/>
      <circle cx="26" cy="30" r="0.900" fill="#B67F58" opacity="0.22"/>
