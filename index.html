<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4E5A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      default statt black-translucent: Mit black-translucent legt iOS 26/27 einen milchigen Schleier über den
      oberen Rand und meldet die Höhe um die Statusleiste zu klein (heller Streifen unter der unteren Leiste).
      Mit viewport-fit=cover läuft der Inhalt trotzdem bis unter die Uhr; die feste Fläche in Petrol oben
      (TopBar) gibt ihr die Farbe. iOS übernimmt die Einstellung erst, wenn die App neu auf den Home-Bildschirm
      gelegt wird.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PaarTrip" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Nhà Mình – PaarTrip</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
